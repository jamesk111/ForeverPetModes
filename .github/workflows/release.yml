name: Validate and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Check syntax and behavior
        run: |
          for file in ForeverPetModes/*.lua; do luac5.1 -p "$file"; done
          lua5.1 tests/run.lua
      - name: Validate package
        shell: bash
        run: |
          version=$(sed -n 's/^## Version: //p' ForeverPetModes/ForeverPetModes.toc)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=${GITHUB_REF_NAME#v}; fi
          python3 tools/package.py "$version"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: install-zip
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: install-zip
          path: dist
      - name: Publish installable ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --title "Forever Pet Modes $GITHUB_REF_NAME" --generate-notes
          else
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          fi
